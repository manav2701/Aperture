# Local development dependencies. Services themselves run on the host with `pnpm dev`.
#   docker compose -f infra/compose.dev.yml up -d
# Credentials here are for local development only.
name: aperture-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aperture -d aperture']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: aperture
      MINIO_ROOT_PASSWORD: aperture-dev-password
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
