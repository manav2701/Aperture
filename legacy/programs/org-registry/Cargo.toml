[package]
name = "org-registry"
version = "0.1.0"
description = "Aperture v3 Organization Registry & Role-Based Access Control Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "org_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
digest = "=0.10.7"
