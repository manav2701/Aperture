name: Nightly

# Long property-based and concurrency runs (plan/testing). Pull requests run the same tests
# with small case counts; here they run with many more cases and fresh random seeds.
on:
  schedule:
    - cron: '0 1 * * *' # 05:00 in Dubai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    name: Long property and concurrency runs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pure property tests, 20 runs with new seeds
        run: for i in $(seq 1 20); do pnpm --filter @aperture/core --filter @aperture/crypto --filter @aperture/cli test || exit 1; done
      - name: Ledger invariants and deadlock hunt on real Postgres
        run: pnpm --filter @aperture/db test
        env:
          PROPERTY_RUNS: '300'
          DEADLOCK_ROUNDS: '150'
