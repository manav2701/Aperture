name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (supply-chain defence, plan/security).
# Renovate proposes updates; review the diff of the action before merging.

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm check:legacy-imports
      - run: pnpm build

  security:
    name: Secrets, SAST, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact
          --gitleaks-ignore-path /repo/.gitleaksignore /repo
      - name: Semgrep custom rule tests
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0
          semgrep --test --config .semgrep/aperture.yml .semgrep/aperture.ts
      - name: Semgrep scan
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0
          semgrep scan --metrics off --error
          --config p/typescript --config p/nodejs --config p/secrets --config .semgrep/aperture.yml
          --exclude legacy --exclude .semgrep
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  images:
    name: Service image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, gateway, worker, signer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f infra/docker/service.Dockerfile --build-arg APP=${{ matrix.app }} -t aperture-${{ matrix.app }}:ci .
      - name: Smoke test
        run: |
          # Placeholder config: /healthz needs no database (the pool connects lazily), but the
          # services refuse to start without their required settings.
          placeholder_secret=$(printf 'x%.0s' $(seq 1 32))
          placeholder_kek=$(head -c 32 /dev/urandom | base64)
          docker run --rm -d --name svc -p 8080:8080 -e PORT=8080 -e WEB_ORIGIN=http://localhost \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke -e BETTER_AUTH_SECRET="$placeholder_secret" \
            -e APERTURE_KEY_PEPPER="$placeholder_secret" -e APERTURE_KEK_V1="$placeholder_kek" \
            -e RESEND_API_KEY=re_smoke aperture-${{ matrix.app }}:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs svc
          exit 1
